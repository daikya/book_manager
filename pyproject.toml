[project]
name = "book-manager"
version = "0.1.0"
description = "Personal book collection manager"
requires-python = ">=3.12"
dependencies = ["requests>=2.32", "Pillow>=10.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
